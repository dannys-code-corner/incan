{% extends "base.html" %}

<!--
  Material emits a single `<link rel="icon">` for `theme.favicon`. These extra
  links cover the cases that one tag does not: a crisp 32px PNG for browsers
  that prefer PNG over ICO, and the touch icon iOS uses when a visitor adds the
  site to their home screen.

  The hrefs are site-root absolute on purpose. `docs_site_deploy.yml` publishes
  `docs/shared/` to the gh-pages root, outside mike's versioned directories, so
  every docs version resolves these to the same shared asset.
-->
{% block extrahead %}
  {{ super() }}
  <link rel="icon" type="image/png" sizes="32x32" href="/shared/incapunk/favicon_32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/shared/incapunk/apple_touch_icon_180.png">
{% endblock %}
