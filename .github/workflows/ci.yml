name: CI

on:
  push:
    branches: [ main, release/** ]
  pull_request:
    branches: [ main, release/** ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  INCAN_NO_BANNER: 1
  COLD_PROVIDER_TEST_FILTER: >-
    test(/(concurrent_normal_checks_reuse_sealed_sdk_inventory_without_mutable_publication|cold_rooted_workspace_lock_uses_bounded_native_units_and_strict_library_build_agrees_issue931|test_run_std_regex_rfc059_surface_from_sealed_sdk_inventory)/)
  GENERATED_CACHE_ACCEPTANCE_TEST_FILTER: >-
    test(/normal_oven_reuses_sealed_inputs_offline_across_projects/)

jobs:
  changes:
    name: CI Scope
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Classify the pull request
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          docs_only=false
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF" --depth=1
            base_ref="origin/$BASE_REF"
            changed=false
            docs_only=true

            while IFS= read -r -d '' file; do
              changed=true
              # The two generated reference pages are derived from the compiler,
              # so they must retain the full generated-reference check.
              case "$file" in
                workspaces/docs-site/docs/language/reference/language.md|workspaces/docs-site/docs/language/reference/feature_inventory.md)
                  docs_only=false
                  break
                  ;;
                workspaces/docs-site/*)
                  ;;
                *)
                  docs_only=false
                  break
                  ;;
              esac
            done < <(git diff --name-only -z "$base_ref" HEAD)

            if [ "$changed" = false ]; then
              docs_only=false
            fi
          fi

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    steps:
      - uses: actions/checkout@v5
      # Comment wrapping (comment_width/wrap_comments/format_code_in_doc_comments) requires nightly rustfmt.
      # We intentionally use nightly for *formatting only*; all builds/tests remain on stable/MSRV jobs.
      # Install stable first (rustup), then nightly with retries — nightly channel sync sometimes flakes on the network.
      - uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal
      - uses: ./.github/actions/install-nightly-toolchain
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo +nightly fmt --all -- --check

  rustdoc-gate:
    name: Rustdoc Gate
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check changed Rust docs
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            base_ref="origin/${{ github.base_ref }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base_ref="${{ github.event.before }}"
          else
            base_ref="HEAD^"
          fi
          python3 scripts/check_changed_rustdocs.py --base "$base_ref"

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Share registry/target across stable jobs; the Linux test shard is the cache writer.
          shared-key: incan-stable
          save-if: false
      - uses: ./.github/actions/setup-rust-sccache
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Show sccache stats
        if: always()
        run: ${SCCACHE_PATH:-sccache} --show-stats || true

  test-linux-archive:
    name: Test Suite Archive (ubuntu-latest, stable)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Install WASI target for vocab desugarers
        run: rustup target add wasm32-wasip1
      - name: Restore Cargo sources
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: incan-test-cargo-sources-v2-stable-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'crates/incan_stdlib/stdlib/components/**/vocab_companion/Cargo.lock') }}
          restore-keys: |
            incan-test-cargo-sources-v1-stable-${{ runner.os }}-${{ runner.arch }}-
      - name: Fetch locked Cargo sources
        run: make fetch-locked-cargo-sources
      - uses: taiki-e/install-action@nextest
      - name: Build portable test archive
        run: |
          mkdir -p target/nextest-ci
          CARGO_BUILD_JOBS=2 cargo nextest archive --workspace --profile ci \
            --archive-file target/nextest-ci/test-suite.tar.zst
      - name: Upload portable test archive
        uses: actions/upload-artifact@v6
        with:
          name: test-linux-nextest-archive
          path: target/nextest-ci/test-suite.tar.zst
          if-no-files-found: error
          retention-days: 1
      - name: Upload matching Incan CLI
        uses: actions/upload-artifact@v6
        with:
          name: test-linux-incan-cli
          path: target/debug/incan
          if-no-files-found: error
          retention-days: 1
      - name: Upload checked-reference generators
        uses: actions/upload-artifact@v6
        with:
          name: test-linux-reference-generators
          path: |
            target/debug/generate_lang_reference
            target/debug/generate_feature_inventory
          if-no-files-found: error
          retention-days: 1

  test-linux-provider:
    name: SDK Provider Warmup (ubuntu-latest, stable)
    runs-on: ubuntu-latest
    needs:
      - changes
      - test-linux-archive
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Install WASI target for vocab desugarers
        run: rustup target add wasm32-wasip1
      - name: Restore Cargo sources
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: incan-test-cargo-sources-v3-stable-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'crates/incan_stdlib/stdlib/components/**/vocab_companion/Cargo.lock', 'tests/fixtures/oven_native_seed_dependencies/Cargo.lock') }}
          restore-keys: |
            incan-test-cargo-sources-v1-stable-${{ runner.os }}-${{ runner.arch }}-
      - name: Fetch locked Cargo sources
        run: make fetch-locked-cargo-sources
      - name: Fetch locked Oven native publisher sources
        # This publisher-only registry inventory makes the provider job's later offline native-unit publication
        # reproducible; ordinary Oven consumers never fetch or invoke Cargo.
        run: make fetch-oven-native-unit-sources
      - name: Download matching Incan CLI
        uses: actions/download-artifact@v6
        with:
          name: test-linux-incan-cli
          path: target/debug
      - name: Restore CLI executable permission
        run: chmod +x target/debug/incan
      - uses: ./.github/actions/restore-sdk-provider-store
      - name: Prewarm compiled SDK providers
        # Ordinary test shards share the immutable SDK inventory and compiler-owned native units. The separate
        # cold-provider acceptance job does not download either artifact, so it still proves first publication from
        # an empty provider store rather than inheriting a warmed test fixture.
        run: >-
          CARGO_BUILD_JOBS=2
          CARGO_NET_OFFLINE=true
          INCAN_SOURCE_ROOT="$GITHUB_WORKSPACE"
          INCAN_STDLIB="$GITHUB_WORKSPACE/crates/incan_stdlib/stdlib"
          INCAN_STDLIB_DIR="$GITHUB_WORKSPACE/crates/incan_stdlib/stdlib"
          INCAN_TOOLCHAIN_CRATES_DIR="$GITHUB_WORKSPACE/crates"
          INCAN_GENERATED_CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/incan_generated_shared_target"
          INCAN_INTERNAL_SDK_PROVIDER_STORE="$GITHUB_WORKSPACE/target/incan_test_sdk_provider_store"
          make test-prewarm-oven-native-units
      - name: Upload compiled SDK provider store
        # The provider store is a bounded immutable product of the matching compiler, not part of the test archive.
        uses: actions/upload-artifact@v6
        with:
          name: test-linux-sdk-provider-store
          path: target/incan_test_sdk_provider_store
          if-no-files-found: error
          retention-days: 1
      - name: Upload selected SDK provider inventory
        # The sealed inventory path selects one digest-verified entry inside the immutable provider store.
        # Downstream normal-command consumers must receive this selection instead of rediscovering a provider.
        uses: actions/upload-artifact@v6
        with:
          name: test-linux-sdk-provider-path
          path: target/incan_test_sdk_provider_path
          if-no-files-found: error
          retention-days: 1
      - name: Upload compiler-owned Oven native units
        # These bounded, digest-verified direct-rustc units are produced only by the named legacy_cargo publisher.
        # Transferring them lets all normal-command test children run with no Cargo fallback.
        uses: actions/upload-artifact@v6
        with:
          name: test-linux-oven-native-units
          path: target/share/incan/oven/native-units
          if-no-files-found: error
          retention-days: 1

  test-linux-shards:
    name: Test Suite Shard (ubuntu-latest, stable, ${{ matrix.label }})
    runs-on: ubuntu-latest
    needs:
      - changes
      - test-linux-archive
      - test-linux-provider
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: slice 1/4
            kind: ordinary
            partition: 1
          - label: slice 2/4
            kind: ordinary
            partition: 2
          - label: slice 3/4
            kind: ordinary
            partition: 3
          - label: slice 4/4
            kind: ordinary
            partition: 4
          - label: managed generated-cache acceptance
            kind: generated-cache
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Install WASI target for vocab desugarers
        run: rustup target add wasm32-wasip1
      - name: Restore Cargo sources
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: incan-test-cargo-sources-v2-stable-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'crates/incan_stdlib/stdlib/components/**/vocab_companion/Cargo.lock') }}
          restore-keys: |
            incan-test-cargo-sources-v1-stable-${{ runner.os }}-${{ runner.arch }}-
      - name: Fetch locked Cargo sources
        run: make fetch-locked-cargo-sources
      - uses: taiki-e/install-action@nextest
      - name: Download portable test archive
        uses: actions/download-artifact@v6
        with:
          name: test-linux-nextest-archive
          path: target/nextest-ci
      - name: Download compiled SDK provider store
        uses: actions/download-artifact@v6
        with:
          name: test-linux-sdk-provider-store
          path: target/incan_test_sdk_provider_store
      - name: Download compiler-owned Oven native units
        # Only the generated-cache acceptance fixture exercises the registry-leaf normal-command path. Avoid
        # transferring this bounded ~1 GiB catalog to the four ordinary shards that do not consume it.
        if: matrix.kind == 'generated-cache'
        uses: actions/download-artifact@v6
        with:
          name: test-linux-oven-native-units
          path: target/share/incan/oven/native-units
      - name: Report test cache footprint
        run: |
          du -sh target
          df -h "$GITHUB_WORKSPACE"
      - name: Run ordinary test shard
        if: matrix.kind == 'ordinary'
        # The separate cold-provider job and generated-cache matrix entry own the heavyweight acceptance tests. Four
        # ordinary shards plus those lanes fit the observed hosted-runner capacity, while the archive avoids rebuilding
        # the workspace.
        run: >-
          CARGO_BUILD_JOBS=2
          INCAN_GENERATED_CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/incan_generated_shared_target"
          INCAN_INTERNAL_SDK_PROVIDER_STORE="$GITHUB_WORKSPACE/target/incan_test_sdk_provider_store"
          cargo nextest run
          --archive-file target/nextest-ci/test-suite.tar.zst
          --workspace-remap "$GITHUB_WORKSPACE"
          --profile ci
          --partition slice:${{ matrix.partition }}/4
          -E "not (($COLD_PROVIDER_TEST_FILTER) | ($GENERATED_CACHE_ACCEPTANCE_TEST_FILTER))"
      - name: Verify generated-cache acceptance inventory
        if: matrix.kind == 'generated-cache'
        run: |
          selected="$(
            cargo nextest list \
              --archive-file target/nextest-ci/test-suite.tar.zst \
              --workspace-remap "$GITHUB_WORKSPACE" \
              --profile ci \
              -E "$GENERATED_CACHE_ACCEPTANCE_TEST_FILTER" \
              -T oneline
          )"
          printf '%s\n' "$selected"
          count="$(printf '%s\n' "$selected" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$count" != "1" ]; then
            echo "expected exactly 1 generated-cache acceptance test, found $count"
            exit 1
          fi
      - name: Run managed generated-cache acceptance
        if: matrix.kind == 'generated-cache'
        run: >-
          CARGO_BUILD_JOBS=2
          INCAN_GENERATED_CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/incan_generated_shared_target"
          INCAN_INTERNAL_OVEN_NATIVE_UNIT_EXECUTION=1
          INCAN_INTERNAL_TOOLCHAIN_DATA_ROOT="$GITHUB_WORKSPACE/target"
          INCAN_INTERNAL_SDK_PROVIDER_STORE="$GITHUB_WORKSPACE/target/incan_test_sdk_provider_store"
          cargo nextest run
          --archive-file target/nextest-ci/test-suite.tar.zst
          --workspace-remap "$GITHUB_WORKSPACE"
          --profile ci
          -E "$GENERATED_CACHE_ACCEPTANCE_TEST_FILTER"

  test-linux-cold-provider:
    name: Cold SDK Provider Acceptance (ubuntu-latest, stable)
    runs-on: ubuntu-latest
    needs:
      - changes
      - test-linux-archive
      - test-linux-provider
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Install WASI target for vocab desugarers
        run: rustup target add wasm32-wasip1
      - name: Restore Cargo sources
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: incan-test-cargo-sources-v2-stable-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'crates/incan_stdlib/stdlib/components/**/vocab_companion/Cargo.lock') }}
          restore-keys: |
            incan-test-cargo-sources-v1-stable-${{ runner.os }}-${{ runner.arch }}-
      - name: Fetch locked Cargo sources
        run: make fetch-locked-cargo-sources
      - uses: taiki-e/install-action@nextest
      - name: Download portable test archive
        uses: actions/download-artifact@v6
        with:
          name: test-linux-nextest-archive
          path: target/nextest-ci
      - name: Download sealed SDK provider store
        uses: actions/download-artifact@v6
        with:
          name: test-linux-sdk-provider-store
          path: target/incan_test_sdk_provider_store
      - name: Download selected SDK provider inventory
        uses: actions/download-artifact@v6
        with:
          name: test-linux-sdk-provider-path
          path: target
      - name: Download compiler-owned Oven native units
        uses: actions/download-artifact@v6
        with:
          name: test-linux-oven-native-units
          path: target/share/incan/oven/native-units
      - name: Verify cold-provider inventory
        run: |
          selected="$(
            cargo nextest list \
              --archive-file target/nextest-ci/test-suite.tar.zst \
              --workspace-remap "$GITHUB_WORKSPACE" \
              --profile ci \
              -E "$COLD_PROVIDER_TEST_FILTER" \
              -T oneline
          )"
          printf '%s\n' "$selected"
          count="$(printf '%s\n' "$selected" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$count" != "3" ]; then
            echo "expected exactly 3 cold-provider acceptance tests, found $count"
            exit 1
          fi
      - name: Run cold-provider acceptance
        run: |
          provider_inventory="$(cat "$GITHUB_WORKSPACE/target/incan_test_sdk_provider_path")/sdk-inventory.json"
          test -f "$provider_inventory"
          CARGO_BUILD_JOBS=1 \
          INCAN_SDK_INVENTORY="$provider_inventory" \
          INCAN_INTERNAL_SDK_PROVIDER_PATH_FILE="$GITHUB_WORKSPACE/target/incan_test_sdk_provider_path" \
          INCAN_INTERNAL_OVEN_NATIVE_UNIT_EXECUTION=1 \
          INCAN_INTERNAL_TOOLCHAIN_DATA_ROOT="$GITHUB_WORKSPACE/target" \
          INCAN_GENERATED_CARGO_TARGET_DIR="$RUNNER_TEMP/incan_cold_generated_target" \
          INCAN_TEST_COLD_PROVIDER_STORE="$RUNNER_TEMP/incan_cold_provider_store" \
          INCAN_INTERNAL_SDK_PROVIDER_STORE="$RUNNER_TEMP/incan_cold_provider_store" \
          cargo nextest run \
          --archive-file target/nextest-ci/test-suite.tar.zst \
          --workspace-remap "$GITHUB_WORKSPACE" \
          --profile ci \
          -E "$COLD_PROVIDER_TEST_FILTER"

  test-linux:
    name: Test Suite (ubuntu-latest, stable)
    runs-on: ubuntu-latest
    needs:
      - changes
      - test-linux-shards
      - test-linux-cold-provider
    if: ${{ always() && needs.changes.outputs.docs_only != 'true' }}
    steps:
      - name: Verify Ubuntu test shards
        run: |
          if [ "${{ needs.test-linux-shards.result }}" != "success" ]; then
            echo "test-linux-shards finished with ${{ needs.test-linux-shards.result }}"
            exit 1
          fi
          if [ "${{ needs.test-linux-cold-provider.result }}" != "success" ]; then
            echo "test-linux-cold-provider finished with ${{ needs.test-linux-cold-provider.result }}"
            exit 1
          fi
          echo "ubuntu test shards passed"

  test-macos-archive:
    name: Test Suite Archive (macos-latest, stable)
    runs-on: macos-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5
