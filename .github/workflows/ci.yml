              --profile ci \
              -E "$GENERATED_CACHE_ACCEPTANCE_TEST_FILTER" \
              -T oneline
          )"
          printf '%s\n' "$selected"
          count="$(printf '%s\n' "$selected" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [ "$count" != "1" ]; then
            echo "expected exactly 1 generated-cache acceptance test, found $count"
            exit 1
          fi
      - name: Run managed generated-cache acceptance
        if: matrix.kind == 'generated-cache'
        run: >-
          CARGO_BUILD_JOBS=2
          INCAN_GENERATED_CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target/incan_generated_shared_target"
          INCAN_INTERNAL_OVEN_NATIVE_UNIT_EXECUTION=1
          INCAN_INTERNAL_TOOLCHAIN_DATA_ROOT="$GITHUB_WORKSPACE/target"
          INCAN_INTERNAL_SDK_PROVIDER_STORE="$GITHUB_WORKSPACE/target/incan_test_sdk_provider_store"
          cargo nextest run
          --archive-file target/nextest-ci/test-suite.tar.zst
          --workspace-remap "$GITHUB_WORKSPACE"
          --profile ci
          -E "$GENERATED_CACHE_ACCEPTANCE_TEST_FILTER"

