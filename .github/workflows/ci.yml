        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: incan-test-cargo-sources-v3-msrv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'crates/incan_stdlib/stdlib/components/**/vocab_companion/Cargo.lock', 'tests/fixtures/oven_native_seed_dependencies/Cargo.lock') }}
          restore-keys: |
            incan-test-cargo-sources-v1-msrv-${{ runner.os }}-${{ runner.arch }}-
      - name: Fetch locked Cargo sources
        run: make fetch-locked-cargo-sources
      - name: Fetch locked Oven native publisher sources
        run: make fetch-oven-native-unit-sources
      - name: Download matching Incan CLI
        uses: actions/download-artifact@v6
        with:
          name: msrv-test-incan-cli
          path: target/debug
      - name: Restore CLI executable permission
        run: chmod +x target/debug/incan
      - uses: ./.github/actions/restore-sdk-provider-store
      - name: Prewarm compiled SDK providers
        # Ordinary test shards share the immutable SDK inventory and compiler-owned native units. The separate
        # cold-provider acceptance job does not download either artifact, so it still proves first publication from
        # an empty provider store rather than inheriting a warmed test fixture.
        run: >-
          CARGO_BUILD_JOBS=2
          CARGO_NET_OFFLINE=true
          INCAN_SOURCE_ROOT="$GITHUB_WORKSPACE"
          INCAN_STDLIB="$GITHUB_WORKSPACE/crates/incan_stdlib/stdlib"
