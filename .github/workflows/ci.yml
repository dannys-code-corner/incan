  udeps:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          profile: minimal
      - uses: ./.github/actions/install-nightly-toolchain
      - name: Compute udeps cache key
        id: udeps-cache-key
        shell: bash
        run: |
          set -euo pipefail

          workspace_version="$(
            awk '
              /^\[workspace.package\]/ { in_section=1; next }
              /^\[/ { in_section=0 }
              in_section && /^version = / {
                gsub(/"/, "", $3)
                print $3
                exit
              }
            ' Cargo.toml
          )"
          if [ -z "$workspace_version" ]; then
            echo "failed to read [workspace.package].version from Cargo.toml" >&2
            exit 1
          fi

          release_line="$(
            printf '%s\n' "$workspace_version" |
              sed -E 's/^([0-9]+)\.([0-9]+)\..*$/v\1.\2/'
          )"
          if [ "$release_line" = "$workspace_version" ]; then
            echo "failed to derive release line from workspace version: $workspace_version" >&2
            exit 1
          fi

          key="$(
            {
              rustc +nightly -Vv
              cargo +nightly -V
              printf 'workspace-release-line=%s\n' "$release_line"
              git ls-files 'Cargo.toml' '*/Cargo.toml' 'Cargo.lock' '*/Cargo.lock' | sort | while read -r file; do
                printf '== %s ==\n' "$file"
                WORKSPACE_VERSION="$workspace_version" RELEASE_LINE="$release_line" perl -pe '
                  BEGIN {
                    $from = quotemeta($ENV{"WORKSPACE_VERSION"});
                    $to = $ENV{"RELEASE_LINE"};
                  }
                  s/$from/$to/g;
                ' "$file"
              done
            } | shasum -a 256 | cut -d ' ' -f 1
          )"

          echo "release-line=$release_line" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: incan-udeps
          key: ${{ steps.udeps-cache-key.outputs.key }}
          add-rust-environment-hash-key: "false"
          cache-all-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/setup-rust-sccache
      - name: Install cargo-udeps
        run: cargo install cargo-udeps --locked
      - name: Run cargo udeps
        run: cargo +nightly udeps --all-targets
      - name: Show sccache stats
        if: always()
        run: ${SCCACHE_PATH:-sccache} --show-stats || true

  smoke-release:
    name: Smoke Release Build
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Keep release-profile artifacts separate from the dev/test cache.
          shared-key: incan-stable-release
          cache-workspace-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build release compiler once
        run: make smoke-test-release
      - name: Upload release compiler
        uses: actions/upload-artifact@v6
        with:
          name: incan-release-bin
          path: target/release/incan
          if-no-files-found: error
          retention-days: 1

  smoke-test-shards:
    name: Smoke Test Shard (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs:
      - changes
      - smoke-release
      - test-linux-provider
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: canary
            make-target: smoke-test-canary
            examples-timeout: 5
          - name: web-example
            make-target: smoke-test-web-example
            examples-timeout: 5
          - name: nested-project
            make-target: smoke-test-nested-project-example
            examples-timeout: 5
          - name: examples
            make-target: smoke-test-examples
            examples-timeout: 20
          - name: benchmarks
            make-target: smoke-test-benchmarks-incan
            examples-timeout: 5
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: incan-stable
          cache-targets: false
          # Smoke shards only need restore access; stable test shards own this shared cache.
          save-if: false
      - uses: ./.github/actions/setup-rust-sccache
      - name: Install WASI target for vocab desugarers
        run: rustup target add wasm32-wasip1
      - name: Download release compiler
        uses: actions/download-artifact@v6
        with:
          name: incan-release-bin
          path: target/release
      - name: Restore executable bit
        run: chmod +x target/release/incan
      - name: Download compiled SDK provider store
        uses: actions/download-artifact@v6
        with:
          name: test-linux-sdk-provider-store
          path: target/incan_test_sdk_provider_store
      - name: Download selected SDK provider inventory
        uses: actions/download-artifact@v6
        with:
          name: test-linux-sdk-provider-path
          path: target
      - name: Download compiler-owned Oven native units
        # Smoke commands are normal Oven consumers. They receive the same immutable catalog as the release-compatible
        # test provider, rather than creating a generated-Cargo cache or materializing a private closure per shard.
        uses: actions/download-artifact@v6
        with:
          name: test-linux-oven-native-units
          path: target/share/incan/oven/native-units
      - name: Install Cargo prohibition guard
        run: |
          mkdir -p target/ci-cargo-guard
          cat > target/ci-cargo-guard/cargo <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "unexpected Cargo invocation during normal Oven smoke command: $*" >> "$CARGO_GUARD_LOG"
          exit 97
          EOF
          chmod +x target/ci-cargo-guard/cargo
          : > target/ci-cargo-guard/invocations.log
      - name: Run normal Oven smoke shard without Cargo
        run: |
          export PATH="$GITHUB_WORKSPACE/target/ci-cargo-guard:$PATH"
          export CARGO_GUARD_LOG="$GITHUB_WORKSPACE/target/ci-cargo-guard/invocations.log"
          make ${{ matrix.make-target }}
          if [ -s "$CARGO_GUARD_LOG" ]; then
            cat "$CARGO_GUARD_LOG" >&2
            exit 1
          fi
        env:
          INCAN_EXAMPLES_TIMEOUT: ${{ matrix.examples-timeout }}
      - name: Show sccache stats
        if: always()
        run: ${SCCACHE_PATH:-sccache} --show-stats || true

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs:
      - changes
      - smoke-release
      - smoke-test-shards
    if: ${{ always() && needs.changes.outputs.docs_only != 'true' }}
    steps:
      - name: Verify smoke jobs
        run: |
          if [ "${{ needs.smoke-release.result }}" != "success" ]; then
            echo "smoke-release finished with ${{ needs.smoke-release.result }}"
            exit 1
          fi
          if [ "${{ needs.smoke-test-shards.result }}" != "success" ]; then
            echo "smoke-test-shards finished with ${{ needs.smoke-test-shards.result }}"
            exit 1
          fi
          echo "smoke jobs passed"

  generate-rust-docs:
    name: Docs Build
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/setup-rust-sccache
      - name: Build docs
        run: cargo doc --no-deps
      - name: Show sccache stats
        if: always()
        run: ${SCCACHE_PATH:-sccache} --show-stats || true

  docs-site:
    name: Docs Site Build (MkDocs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspaces/docs-site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install MkDocs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docs.txt
      - name: Build docs site (strict)
        run: python -m mkdocs build --strict

  generated-reference:
    name: Generated Reference Up-to-date
    runs-on: ubuntu-latest
    needs:
      - changes
      - test-linux-archive
      - test-linux-provider
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Restore Cargo sources
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: incan-test-cargo-sources-v2-stable-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'crates/incan_stdlib/stdlib/components/**/vocab_companion/Cargo.lock') }}
          restore-keys: |
            incan-test-cargo-sources-v1-stable-${{ runner.os }}-${{ runner.arch }}-
      - name: Fetch locked Cargo sources
        run: make fetch-locked-cargo-sources
      - name: Download matching Incan CLI
        uses: actions/download-artifact@v6
        with:
          name: test-linux-incan-cli
          path: target/debug
      - name: Download checked-reference generators
        uses: actions/download-artifact@v6
        with:
          name: test-linux-reference-generators
          path: target/debug
      - name: Restore executable permissions
        run: chmod +x target/debug/incan target/debug/generate_lang_reference target/debug/generate_feature_inventory
      - name: Fingerprint checked feature inventory
        id: inventory-identity
        run: |
          {
            echo "compiler=$(shasum -a 256 target/debug/incan | awk '{print $1}')"
            echo "lock=$(shasum -a 256 Cargo.lock | awk '{print $1}')"
            echo "stdlib=$(git rev-parse HEAD:crates/incan_stdlib/stdlib)"
          } >> "$GITHUB_OUTPUT"
      - name: Restore checked feature inventory providers
        id: inventory-provider-cache
        uses: actions/cache@v4
        with:
          path: target/incan_reference_sdk_provider_store
          key: >-
            incan-feature-inventory-provider-v1-${{ runner.os }}-${{ runner.arch }}-${{
            steps.inventory-identity.outputs.compiler }}-${{ steps.inventory-identity.outputs.lock }}-${{
            steps.inventory-identity.outputs.stdlib }}
      - name: Seed checked feature inventory providers
        if: steps.inventory-provider-cache.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v6
        with:
          name: test-linux-sdk-provider-store
          path: target/incan_reference_sdk_provider_store
      - name: Regenerate checked language references
        run: ./target/debug/generate_lang_reference
      - name: Regenerate checked capability inventory
        run: ./target/debug/generate_feature_inventory
        env:
          CARGO_BUILD_JOBS: "2"
          CARGO_BIN_EXE_incan: ${{ github.workspace }}/target/debug/incan
          INCAN_SOURCE_ROOT: ${{ github.workspace }}
          INCAN_STDLIB: ${{ github.workspace }}/crates/incan_stdlib/stdlib
          INCAN_STDLIB_DIR: ${{ github.workspace }}/crates/incan_stdlib/stdlib
          INCAN_TOOLCHAIN_CRATES_DIR: ${{ github.workspace }}/crates
          INCAN_GENERATED_CARGO_TARGET_DIR: ${{ runner.temp }}/incan_reference_generated_target
          INCAN_INTERNAL_SDK_PROVIDER_STORE: ${{ github.workspace }}/target/incan_reference_sdk_provider_store
      - name: Verify no generated-reference diff
        run: git diff --exit-code workspaces/docs-site/docs/language/reference/language.md workspaces/docs-site/docs/language/reference/feature_inventory.md
