    name: MSRV Test Archive (1.93.0)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
