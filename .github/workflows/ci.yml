            exit 1
          fi
          echo "bounded macOS Oven compiler suite passed"
  msrv-build:
    name: MSRV Build (1.93.0)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust 1.93.0
